<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STC32G 图形化编程</title>
</head>

<body>
    <header class="app-header">
        <div class="header-left">
            <div class="chip-status" title="芯片状态">
                <span class="status-led"></span>
                <span class="status-led"></span>
                <span class="status-led"></span>
            </div>
            <h1>STC32G 图形化编程</h1>
            <span class="header-chip-label">STC32G12K128</span>
            <span id="project-name" class="project-name" title="当前项目">未命名项目</span>
        </div>
        <div class="actions">
            <button id="btn-new-project" title="新建空白项目 (Ctrl+N)">新建</button>
            <button id="btn-open-project" title="打开项目文件 (Ctrl+O)">打开</button>
            <button id="btn-save-project" title="保存项目 (Ctrl+S)">保存</button>
            <button id="btn-save-project-as" title="项目另存为 (Ctrl+Shift+S)">另存为</button>
            <span class="action-sep" aria-hidden="true"></span>
            <button id="btn-generate">生成代码</button>
            <button id="btn-copy">复制</button>
            <button id="btn-download">下载 main.c</button>
            <button id="btn-compile" title="使用 Keil C251 编译当前代码">编译</button>
            <button id="btn-keil-path" title="手动选择 Keil 安装目录或 UV4.exe">Keil 路径</button>
            <button id="btn-keil-clear" class="hidden" title="清除手动路径，恢复自动探测">重置路径</button>
            <button id="btn-open-hex" class="hidden" title="在资源管理器中显示 hex">打开 hex</button>
            <span id="compile-status" class="compile-status" aria-live="polite"></span>
            <button id="code-toggle" class="toggle-btn" title="折叠/展开代码区">收起 ▶</button>
        </div>
    </header>
    <main class="app-body">
        <div id="blockly-div"></div>
        <section class="code-panel" id="code-panel">
            <div class="code-title">生成的 C 代码</div>
            <pre id="code-preview"></pre>
            <div class="build-log-panel" id="build-log-panel">
                <div class="build-log-title">
                    <span>Keil 编译日志</span>
                    <button type="button" id="btn-clear-log" class="log-action" title="清空日志">清空</button>
                </div>
                <pre id="build-log" class="build-log"></pre>
            </div>
        </section>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
