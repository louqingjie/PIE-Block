name: TUI

on:
  push:
    branches: [main]
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/package.ps1 -SkipBuild
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package.sh
        env:
          SKIP_BUILD: "1"
      - name: List package
        shell: bash
        run: ls -lh dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PIE-Block-TUI-${{ runner.os }}
          path: |
            tui/dist/*.zip
            tui/dist/*.tar.gz
            tui/dist/*.sha256
          if-no-files-found: error
