group = "cn.edu.cnu.pieblock_sdcc_native"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def repositoryRoot = project.projectDir.toPath().resolve("../../..").normalize().toFile()
def stageRoot = new File(
    System.getenv("LOCALAPPDATA") ?: System.getProperty("user.home"),
    "PIE-Block/android-sdcc-stages"
)
def preparePieBlockSdccStages = tasks.register("preparePieBlockSdccStages", Exec) {
    commandLine(
        "powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass",
        "-File", new File(repositoryRoot, "tools/build_android_sdcc_stages.ps1"),
        "-OutputRoot", stageRoot,
        "-Abi", "all"
    )
}

android {
    namespace = "cn.edu.cnu.pieblock_sdcc_native"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        minSdk = 24
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DPB_SDCC_STAGE_ROOT=${stageRoot.absolutePath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.dependsOn(preparePieBlockSdccStages)
    }
}
