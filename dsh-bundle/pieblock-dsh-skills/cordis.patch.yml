# PIE-Block AI 规程的 DSH 插件挂载声明。
#
# 插件本身只做一件事：apply 时把包内 skills/ 里的两个 Skill 注册到 DSH 的
# skill 注册表（Host 全局层），装完所有会话可见；卸载即注销。不写用户目录、
# 不改 preset、不需要 PIE-Block 源码仓库。技能正文里的 assets/examples 与
# assets/docs 随包分发，resourceBase 指向技能目录。
- insert:
    - id: pieblock-skills
      name: pieblock-dsh-skills
      config: {}
