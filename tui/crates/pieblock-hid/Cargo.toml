[package]
name = "pieblock-hid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pieblock-toolchain = { path = "../pieblock-toolchain" }
pieblock-core = { path = "../pieblock-core" }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", features = ["linux-static-hidraw"] }


[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
